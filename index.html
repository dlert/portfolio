<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adeniyi Oluwaferanmi — Founder, Ferdar Limited</title>
    <meta name="description" content="Adeniyi Oluwaferanmi, founder of Ferdar Limited. AI-assisted developer building with AI agents, computer vision and mobile apps. Ibadan, Nigeria." />
    <meta name="theme-color" content="#fdfdfd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0b" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply a saved theme before first paint so there's no flash of the wrong one.
      try {
        var t = localStorage.getItem('theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
